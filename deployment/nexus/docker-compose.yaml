volumes:
  ite-nexus-data:
    driver: local
networks:
  ite-net:
    external: true
services:
  ite-nexus:
    container_name: ite-nexus
    image: sonatype/nexus3:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g"
    volumes:
      - ite-nexus-data:/nexus-data
    networks:
      - ite-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
