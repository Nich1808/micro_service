volumes:
  cdc-postgres-vol:
  cdc-kafka-vol:
networks:
  ite-net:
    external: true

services:
  # ---------------------------------------------------------------- source ---
  # wal_level=logical is what makes Debezium's pgoutput plugin work.
  cdc-postgres:
    container_name: cdc-postgres
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "9545:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: db_cdc
      POSTGRES_USER: cdcuser
      POSTGRES_PASSWORD: cdcpass
    volumes:
      - cdc-postgres-vol:/var/lib/postgresql/18/docker
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdcuser -d db_cdc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ite-net

  # ----------------------------------------------------------------- kafka ---
  # Single node KRaft. The 3-broker cluster in deployment/kafka is overkill
  # for CDC and does not fit in the RAM budget alongside Connect and ES.
  cdc-kafka:
    container_name: cdc-kafka
    image: apache/kafka:4.1.1
    restart: unless-stopped
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://cdc-kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@cdc-kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - cdc-kafka-vol:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - ite-net

  # --------------------------------------------------------------- connect ---
  # Runs the Debezium PostgreSQL *source* connector.
  # Converters are JSON with schemas disabled, so Kafka messages are plain JSON
  # that the sink consumer can read without a Schema Registry.
  cdc-connect:
    container_name: cdc-connect
    image: debezium/connect:3.0.0.Final
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      cdc-kafka:
        condition: service_healthy
      cdc-postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: cdc-kafka:9092
      GROUP_ID: cdc-connect-cluster
      CONFIG_STORAGE_TOPIC: cdc_connect_configs
      OFFSET_STORAGE_TOPIC: cdc_connect_offsets
      STATUS_STORAGE_TOPIC: cdc_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: cdc-connect
      CONNECT_PLUGIN_PATH: /kafka/connect
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CONNECT_LOG4J_LOGGERS: "org.apache.zookeeper=ERROR,org.reflections=ERROR"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - ite-net

  # ---------------------------------------------------------- elasticsearch ---
  cdc-elasticsearch:
    container_name: cdc-elasticsearch
    image: elasticsearch:8.19.25
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
    networks:
      - ite-net

  # ------------------------------------------------------------------ sink ---
  # Consumes the Debezium topics, transforms the envelope and bulk indexes into
  # Elasticsearch. See sink/elasticsearch_sink.py.
  cdc-sink:
    container_name: cdc-sink
    build: ./sink
    restart: unless-stopped
    depends_on:
      cdc-elasticsearch:
        condition: service_healthy
      cdc-kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: cdc-kafka:9092
      KAFKA_GROUP: cdc-elasticsearch-sink
      KAFKA_TOPICS: cdc.public.customers,cdc.public.orders,cdc.public.order_items
      ES_URL: http://cdc-elasticsearch:9200
      LOG_LEVEL: INFO
    networks:
      - ite-net
