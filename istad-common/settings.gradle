pluginManagement {
    includeBuild('../build-logic')

    repositories {
        maven {
            name = 'nexus'
            url = uri('http://localhost:8081/repository/istad-public/')
            allowInsecureProtocol = true
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        maven {
            name = 'nexus'
            url = uri('http://localhost:8081/repository/istad-public/')
            allowInsecureProtocol = true
        }
        mavenCentral()
    }

    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'istad-common'
include 'istad-common-bom'
include 'istad-common-domain'
include 'istad-common-restapi'
include 'istad-common-swagger'
include 'istad-common-webflux'
