plugins {
    id 'java-library'
    id 'spring-boot-common-conventions'
}

group = 'kh.edu.istad'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        name = 'buf'
        url 'https://buf.build/gen/maven'
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    api('build.buf.gen:samsreynich1808_grpc_protocolbuffers_java:36.2.0.1.20261106133030.5d51708e9f68')

    api('build.buf.gen:samsreynich1808_grpc_grpc_java:1.85.1.1.20261106133030.5d51708e9f68')

    api 'com.google.protobuf:protobuf-java:4.36.2'
    api 'com.google.protobuf:protobuf-java-util:4.36.2'
}

configurations.configureEach {
    resolutionStrategy {
        force(
                'com.google.protobuf:protobuf-java:4.36.2',
                'com.google.protobuf:protobuf-java-util:4.36.2',
                'io.grpc:grpc-core:1.85.1',
                'io.grpc:grpc-protobuf:1.85.1',
                'io.grpc:grpc-stub:1.85.1'
        )
    }
}
