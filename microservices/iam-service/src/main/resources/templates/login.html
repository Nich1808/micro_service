
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
        }

        main {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        .left, .right {
            display: flex;
            width: 50%;
            min-height: 100vh;
        }

        .left {
            background: linear-gradient(135deg, #0f172a, #1e40af, #3b82f6);
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .left::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .left::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            bottom: -200px;
            right: -150px;
        }

        .left h1 {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -1px;
            z-index: 1;
        }

        .left p {
            font-size: 17px;
            color: #dbeafe;
            z-index: 1;
        }

        .right {
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 400px;
            padding: 42px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
        }

        form h2 {
            font-size: 30px;
            color: #0f172a;
            margin-bottom: 3px;
        }

        form p {
            color: #64748b;
            margin-bottom: 18px;
            font-size: 14px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            width: 100%;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .login-btn {
            margin-top: 12px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            font-size: 13px;
            margin: 8px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            background: white;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1d4ed8;
        }

        .social-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                min-height: 100vh;
                padding: 20px;
            }

            form {
                width: 100%;
                max-width: 400px;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

<main>

    <div class="left">
        <h1>Welcome Back!</h1>
        <p>Login to access your account.</p>
    </div>

    <div class="right">
        <form action="/login" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <h2>Sign In</h2>
            <p>Enter your credentials to continue.</p>

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit" class="login-btn">Login</button>

            <div class="divider">OR</div>

            <a href="/oauth2/authorization/github" class="social-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"
                     alt="GitHub Logo">
                <span>Login with GitHub</span>
            </a>

            <a href="/oauth2/authorization/google" class="social-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                     alt="Google Logo">
                <span>Login with Google</span>
            </a>

        </form>
    </div>

</main>

</body>
</html>
