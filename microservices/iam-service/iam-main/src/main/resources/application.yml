spring:
  application:
    name: iam-service

  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:9543/db_iam}
    username: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD:qwerqwer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/iam-master.yaml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret}
            scope: read:user, user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-client-secret}
            scope: public_profile, email
          telegram:
            client-id: ${TELEGRAM_CLIENT_ID:telegram-client-id}
            client-secret: ${TELEGRAM_CLIENT_SECRET:telegram-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: openid, profile
            provider: telegram
        provider:
          telegram:
            authorization-uri: ${TELEGRAM_AUTHORIZATION_URI:https://oauth.telegram.org/auth}
            token-uri: ${TELEGRAM_TOKEN_URI:https://oauth.telegram.org/auth/access_token}
            user-info-uri: ${TELEGRAM_USER_INFO_URI:https://oauth.telegram.org/user}
            user-name-attribute: id

server:
  port: ${SERVER_PORT:9026}

iam:
  issuer: ${IAM_ISSUER:http://localhost:9026}
  bootstrap:
    web-client:
      redirect-uri: ${IAM_WEB_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/oidc-client}
      post-logout-redirect-uri: ${IAM_WEB_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:8080/}

logging:
  level:
    org.springframework.security: INFO
