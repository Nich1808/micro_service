server:
  port: 9999
spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /$\{segment}
                #- SaveSession
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: nextjs
              uri: http://localhost:3000
              predicates:
                - Path=/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9026

      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:9026

        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/front-bff-client"
            scope:
              - openid
              - profile


management:
  endpoints:
    web:
      exposure:
        include: "health, gateway"
  endpoint:
    gateway:
      access: read_only
