pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        maven {
            name = 'nexus'
            url = uri('http://localhost:8081/repository/istad-public/')
            allowInsecureProtocol = true
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        maven {
            name = 'nexus'
            url = uri('http://localhost:8081/repository/istad-public/')
            allowInsecureProtocol = true
        }
        mavenCentral()
    }

    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = "gateway-server"