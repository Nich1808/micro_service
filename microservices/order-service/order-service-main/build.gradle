plugins {
    id 'spring-cloud-common-conventions'
}

dependencies {

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    implementation project(':order-service-domain:order-domain-core')
    implementation project(':order-service-client')
    implementation project(':order-service-domain:order-application-service')
    implementation project(':order-service-persistence')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
}

tasks.named('test') {
    useJUnitPlatform()
}



dependencyManagement {
    imports {
        mavenBom 'com.google.protobuf:protobuf-bom:4.36.2'
    }
}

configurations.configureEach {
    resolutionStrategy {
        force(
            'com.google.protobuf:protobuf-java:4.36.2',
            'com.google.protobuf:protobuf-java-util:4.36.2'
        )
    }
}
