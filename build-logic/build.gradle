plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    maven {
        name = 'nexus'
        url = uri('http://localhost:8081/repository/istad-public/')
        allowInsecureProtocol = true
    }
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation libs.bundles.gradle.dependency.management
}
