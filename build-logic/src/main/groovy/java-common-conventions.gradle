plugins {
    id 'java-library'
}

group = 'kh.edu.istad'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.language.version.get())
    }
}

repositories {
    maven {
        name = 'nexus'
        url = uri('http://localhost:8081/repository/istad-public/')
        allowInsecureProtocol = true
    }
    mavenCentral()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}